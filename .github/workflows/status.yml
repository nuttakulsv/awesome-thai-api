name: API status

on:
  schedule:
    - cron: "17 1 * * *"   # 08:17 in Bangkok
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 check.py --test
      - run: python3 check.py --update
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md status.json
          git diff --cached --quiet || git commit -m "Update API status"
          git push
